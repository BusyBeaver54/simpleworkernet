[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simpleworkernet"
version = "1.1.1"
description = "Python client library for WorkerNet API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Andrey Litvinov", email = "busy4beaver@gmail.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.28",
    "pydantic>=2.0",
    "igraph>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
graphics = ["Wand", "cairosvg", "weasyprint", "matplotlib"]

[project.scripts]
cleanup-simpleworkernet = "simpleworkernet.scripts.uninstall:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simpleworkernet = ["utils/topology/attenuation/defaults.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that require live WorkerNet API",
]
